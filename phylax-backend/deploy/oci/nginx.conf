# ================================================================================================
# Phylax — the reverse proxy
#
# nginx sits in front of the Express server for two reasons:
#
#   1. Cloudflare's free tier terminates TLS with the world, and talks to this machine over its own encrypted
#      connection. The origin certificate here is the one Cloudflare issued.
#   2. nginx serves the static files, which means the Express process never has to.
#
# The app is on 127.0.0.1:3000. It is not reachable from the internet at all, and neither is the database.
# ================================================================================================

# The limit for a request body. The API never receives a file, so this is generous.
client_max_body_size 1m;

# The real client address, for the rate limiter and the logs.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Cloudflare's addresses, so the real client address is trusted and nothing else can forge the header.
# The list is in deploy/oci/cloudflare-ips.sh, which keeps it up to date.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

geo $realip_remote_addr $from_cloudflare {
 default 0;
 173.245.48.0/20 1;
 103.21.244.0/22 1;
 103.22.200.0/22 1;
 103.31.4.0/22 1;
 141.101.64.0/18 1;
 108.162.192.0/18 1;
 190.93.240.0/20 1;
 188.114.96.0/20 1;
 197.234.240.0/22 1;
 198.41.128.0/17 1;
 162.158.0.0/15 1;
 104.16.0.0/13 1;
 104.24.0.0/14 1;
 172.64.0.0/13 1;
 131.0.72.0/22 1;
 2400:cb00::/32 1;
 2606:4700::/32 1;
 2803:f800::/32 1;
 2405:b500::/32 1;
 2405:8100::/32 1;
 2a06:98c0::/29 1;
 2c0f:f248::/32 1;
}
limit_req_zone $binary_remote_addr zone=phylax_api:10m rate=10r/s;
# Only the sites that are actually pointed at this machine are served.
server {
    listen 80;
    listen [::]:80;
    server_name phylax.example.com;
    if ($from_cloudflare = 0) { return 444; }
    if ($host != phylax.example.com) { return 444; }

    # Cloudflare talks to the origin over HTTPS on this port. Everything else is redirected to it.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name phylax.example.com;
    if ($from_cloudflare = 0) { return 444; }
    if ($host != phylax.example.com) { return 444; }

    # Authenticated Origin Pulls (mTLS). Cloudflare's source ranges are shared by every Cloudflare tenant, so IP
    # allow-listing alone does NOT prove the request came through this zone. This client CA is installed by the
    # operator at provision time; the `ssl_verify_client on` requirement rejects every TLS client without a valid
    # Cloudflare Origin Pull certificate before a forged CF-Connecting-IP can reach Express.
    ssl_client_certificate /etc/ssl/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;

    # Cloudflare's origin certificate. Replace these two lines with your own.
    # Operations are local-only; root tooling calls Express on loopback.
    #
    # `^~` is a PREFIX match, not an exact one: it stops nginx from evaluating the regex locations below for
    # anything under /api/ops/. The app also runs with case-sensitive routing, so the two layers agree on what
    # a path is — /API/ops/ is a 404 here and a 404 there, rather than sailing past this rule and being served.
    location ^~ /api/ops/ { return 404; }

    # The maintenance page. The deploy script writes this flag file while it is changing the schema, and nginx
    # checks for it on every request: turning maintenance mode on and off needs no reload, and the app never
    # has to serve a half-migrated API.
    location / {
      root /var/lib/phylax;
      try_files /maintenance @app;
    }

    ssl_certificate     /etc/ssl/phylax/origin.pem;
    ssl_certificate_key /etc/ssl/phylax/origin.key;
    server_tokens off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- the security headers ------------------------------------------------------------------
    # The app sets its own, but they are set here too so that a response that never reaches the app (an
    # error page from nginx, say) is still covered.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # ---- the compression ------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # ---- the static files ----------------------------------------------------------------------
    # These are hashed by the build, so they can be cached for a year.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 30d;
        # Cache headers and security headers are supplied by Express only for found assets.
    }

    # ---- everything else ------------------------------------------------------------------------
    # The named fallback from the maintenance check above. `limit_req` stays here, so the rate limit applies to
    # real traffic and not to the maintenance probe.
    location @app {
        limit_req zone=phylax_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # The passkey ceremonies and the one-time links are not large, but a slow client should not be cut off.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }

    # The health check does not go through the app's own logging, and it is not rate limited.
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
