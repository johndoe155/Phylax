<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Tear-off calendar">
  <title>Tear-off calendar</title>
  <defs>
    <filter id="cal-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="cal-page" d="M22.4,30.2 C36,29.6 58,30.4 77.8,29.8 C78.4,44 77.6,60 78.1,69.7 L67.5,82.1 C52,82.6 36,81.8 22.2,82.4 C21.6,66 22.4,46 22.4,30.2 Z"/>

    <!-- hand-drawn digits, each in a 12 x 24 box (9 is the 6 turned upside down) -->
    <g id="cal-d0"><path d="M6,0.6 C10,0.4 11.6,5.2 11.5,12 C11.4,19 9.8,23.6 6,23.5 C2.2,23.4 0.5,19 0.6,12 C0.7,5.2 2,0.7 6.3,0.9"/></g>
    <g id="cal-d1"><path d="M2.4,5.2 C4.4,3.6 5.8,2 7,0.6 C6.8,8 7.2,16 7,23.5"/><path d="M2.6,23.8 L11,23.5" stroke-width="1.4"/></g>
    <g id="cal-d2"><path d="M1,5 C1.4,1.6 4,0.6 6.5,0.7 C9.6,0.9 11,3 10.5,6 C10,9.6 5,14 1,23 C4.6,22.6 8,23 11.5,22.8"/></g>
    <g id="cal-d3"><path d="M1.2,2.6 C3,0.8 6,0.4 8.4,1.2 C11,2.2 10.8,6 8,8.8 C6.8,10 5.6,10.8 4.4,11.2 C8,11 11.6,13 11.2,17 C11,21.6 6,24 1,21.4"/></g>
    <g id="cal-d4"><path d="M8.5,0.8 C6,6 3,12 0.8,16.4 C4,16.2 8,16.6 11.5,16.2"/><path d="M8.6,5 C8.4,11 8.8,18 8.5,23.5"/></g>
    <g id="cal-d5"><path d="M10,1 C7,0.8 4,1.2 2.2,1 C2,4.6 1.6,9 1.2,11.6 C3.6,10 6.6,9.6 8.6,10.6 C11.6,12.2 11.6,17 9.6,20.5 C7.6,23.6 3.6,23.8 0.8,21.6"/></g>
    <g id="cal-d6"><path d="M9.6,2 C6,3 2,8 1.2,14 C0.6,19 2.5,23.6 6,23.5 C9.8,23.4 11.6,19.6 10.4,15.8 C9.2,12.6 5,11.6 2.6,14.2"/></g>
    <g id="cal-d7"><path d="M0.8,1.6 C4,1 8,1.4 11.2,0.8 C8.5,8 6.8,15 5.5,23.5"/></g>
    <g id="cal-d8"><path d="M6,11.6 C2.5,10.5 1.2,7 2.6,4 C4,1 8.5,0.6 10,3.4 C11.4,6.2 9,10 6,11.6 C2,13.2 0.4,17 1.8,20.4 C3.2,23.6 8.8,24 10.6,20.6 C12,17.4 9.4,13.2 6,11.6"/></g>
    <g id="cal-d9"><use href="#cal-d6" transform="rotate(180 6 12)"/></g>
  </defs>

  <g filter="url(#cal-pencil)">
    <!-- page: main pass + loose second pass -->
    <use href="#cal-page"/>
    <use href="#cal-page" transform="translate(0.6,-0.5) rotate(0.6 50 50)" stroke-width="1" opacity="0.5"/>
    <!-- header rule -->
    <path d="M22.6,41 C40,40.4 60,41.4 77.8,40.8"/>
    <!-- binding rings -->
    <path d="M34.5,31 C34,26 34.2,22.5 36.6,22.2 C38.8,22 39.4,26 38.8,31"/>
    <path d="M61.4,31 C60.9,26 61.1,22.5 63.5,22.2 C65.7,22 66.3,26 65.7,31"/>
    <!-- curled corner -->
    <path d="M78,69.6 C71.5,69.8 68,74 67.4,82.2"/>

    <!-- day of month: filled in by the script below; static "14" shows if scripts are blocked -->
    <g class="cal-date"><!--cal-date-->
      <g transform="translate(37,47)"><use href="#cal-d1"/><use href="#cal-d1" transform="translate(0.5,-0.4)" stroke-width="1" opacity="0.5"/></g>
      <g transform="translate(51,47)"><use href="#cal-d4"/><use href="#cal-d4" transform="translate(0.5,-0.4)" stroke-width="1" opacity="0.5"/></g>
    <!--/cal-date--></g>

    <!-- underline scribble -->
    <path d="M36,75.6 C44,74.8 54,76 66,75.2" stroke-width="1.2"/>
    <!-- hatching -->
    <g stroke-width="0.9" opacity="0.8">
      <!-- header band -->
      <path d="M26,40 l5,-9"/>
      <path d="M32,40 l5,-9"/>
      <path d="M38,40 l5,-9"/>
      <path d="M44,40 l5,-9"/>
      <path d="M50,40 l5,-9"/>
      <path d="M56,40 l5,-9"/>
      <path d="M62,40 l5,-9"/>
      <path d="M68,40 l5,-9"/>
      <path d="M74,40 l3,-5.4"/>
      <!-- right-hand shadow -->
      <path d="M72,50 l5,-6"/>
      <path d="M72,56 l5,-6"/>
      <path d="M72,62 l5,-6"/>
      <path d="M72,68 l5,-6"/>
      <!-- curl shadow -->
      <path d="M75.2,73.1 l-1.9,-1.6"/>
      <path d="M72.8,75.9 l-1.9,-1.6"/>
      <path d="M70.4,78.8 l-1.8,-1.6"/>
    </g>
  </g>

  <!-- Shows the viewer's local day of month and refreshes at local midnight.
       Add data-day="23" to the <svg> to pin a specific day instead. -->
  <script><![CDATA[
  (function () {
    var svg = document.currentScript && document.currentScript.ownerSVGElement;
    if (!svg) return;
    var NS = 'http://www.w3.org/2000/svg';
    var slot = svg.querySelector('.cal-date');
    if (!slot) return;

    function digit(n, x) {
      var g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', 'translate(' + x + ',47)');
      var main = document.createElementNS(NS, 'use');
      main.setAttribute('href', '#cal-d' + n);
      var loose = document.createElementNS(NS, 'use');          // faint second pass
      loose.setAttribute('href', '#cal-d' + n);
      loose.setAttribute('transform', 'translate(0.5,-0.4)');
      loose.setAttribute('stroke-width', '1');
      loose.setAttribute('opacity', '0.5');
      g.appendChild(main);
      g.appendChild(loose);
      return g;
    }

    function render() {
      var pinned = parseInt(svg.getAttribute('data-day'), 10);
      var now = new Date();
      var day = pinned >= 1 && pinned <= 31 ? pinned : now.getDate();
      var s = String(day);
      while (slot.firstChild) slot.removeChild(slot.firstChild);
      if (s.length === 1) {
        slot.appendChild(digit(s, 44));                         // single digit, centred
      } else {
        slot.appendChild(digit(s.charAt(0), 37));
        slot.appendChild(digit(s.charAt(1), 51));
      }
      svg.setAttribute('aria-label', 'Tear-off calendar, day ' + day);
      if (isNaN(pinned)) {                                      // roll over at local midnight
        var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
        setTimeout(render, next - now);
      }
    }
    render();
  })();
  ]]></script>
</svg>
