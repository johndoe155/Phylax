<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Shield">
  <title>Shield</title>
  <defs>
    <filter id="shield-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="shield-outer" d="M50,16 C60,21 70,23.4 80,22.6 C80.6,40 79.4,56 72,68 C66,77 58,82.6 50.2,85.4 C42,82.6 34,77 28,68 C20.6,56 19.4,40 20,22.6 C30,23.4 40,21 50,16 Z"/>
  </defs>
  <g filter="url(#shield-pencil)">
    <!-- outer edge: main pass + loose second pass -->
    <use href="#shield-outer"/>
    <use href="#shield-outer" transform="translate(0.6,-0.5) rotate(0.7 50 50)" stroke-width="1" opacity="0.5"/>
    <!-- inner border -->
    <path d="M50,24 C58,27.6 65,29.4 72,29 C72.4,42 71,54 65.6,63.6 C61,70.6 55.6,74.6 50,77 C44.4,74.6 39,70.6 34.4,63.6 C29,54 27.6,42 28,29 C35,29.4 42,27.6 50,24 Z" stroke-width="1.2"/>
    <!-- check mark -->
    <path d="M39,50.4 L47.2,58.6 L61.8,40.4" stroke-width="2.2"/>
    <path d="M39.8,49.6 L47,59.2 L62.6,41" stroke-width="1" opacity="0.6"/>
    <!-- hatching -->
    <g stroke-width="0.9" opacity="0.8">
      <path d="M73,38 L79,32"/>
      <path d="M72.6,44 L79.4,37.6"/>
      <path d="M72.2,50 L79,43.6"/>
      <path d="M71.6,56 L77.6,49.4"/>
      <path d="M69.5,62 L75.6,56"/>
      <path d="M63.4,70.6 L68,67.6"/>
      <path d="M43,68 L49,62.6"/>
      <path d="M47,71 L54,64.6"/>
      <path d="M51,74 L58,67.6"/>
    </g>
  </g>
</svg>
