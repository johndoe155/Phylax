      <use href="#ticket-body"/>
      <use href="#ticket-body" transform="translate(0.6,-0.6) rotate(0.6 50 50)" stroke-width="1" opacity="0.5"/>
      <!-- perforation -->
      <g stroke-width="1.4">
        <path d="M64,34 L64.1,38"/>
        <path d="M64,41 L63.9,45"/>
        <path d="M64,48 L64.1,52"/>
        <path d="M64,55 L63.9,59"/>
        <path d="M64,62 L64.1,66"/>
