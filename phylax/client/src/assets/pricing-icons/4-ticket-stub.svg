<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ticket stub">
  <title>Ticket stub</title>
  <defs>
    <filter id="ticket-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="ticket-body" d="M14.4,32.4 C34,31.8 62,32.6 85.6,32 C85.9,36.5 85.7,40.5 85.8,44.2 C80.4,44.6 80.4,55.4 85.8,55.8 C85.6,60 85.9,64 85.4,68.1 C62,68.8 34,67.6 14.6,68.2 C14.5,64 14.7,60 14.4,55.8 C19.6,55.4 19.6,44.6 14.4,44.2 C14.6,40.2 14.3,36.4 14.4,32.4 Z"/>
  </defs>
  <g filter="url(#ticket-pencil)">
    <g transform="rotate(-6 50 50)">
