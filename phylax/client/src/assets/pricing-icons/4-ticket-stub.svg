        <path d="M28.5,66.8 l3,-4"/>
        <path d="M33,66.8 l3,-4"/>
        <path d="M37.5,66.8 l3,-4"/>
        <path d="M42,66.8 l3,-4"/>
        <path d="M46.5,66.8 l3,-4"/>
        <path d="M51,66.8 l3,-4"/>
        <path d="M55.5,66.8 l3,-4"/>
      </g>
    </g>
  </g>
</svg>
