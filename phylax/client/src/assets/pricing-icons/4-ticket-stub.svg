      <!-- text lines -->
      <path d="M50,42 C53,41.6 56,42 58.2,41.8" stroke-width="1.4"/>
      <path d="M50,50 C53.4,49.6 57,50 60.2,49.7" stroke-width="1.4"/>
      <path d="M50,58 C52.4,57.6 54,58 56.2,57.8" stroke-width="1.4"/>
      <!-- barcode -->
      <g stroke-width="1.2">
        <path d="M69,40 L69.2,60"/>
        <path d="M71.4,40 L71.2,60"/>
        <path d="M73,40.2 L73.1,59.8"/>
