<svg xmlns="http://www.w3.org/2000/svg" class="logo-mark" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Phylax logo">
  <title>Phylax logo</title>
  <defs>
    <filter id="phylax-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
