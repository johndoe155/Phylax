<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Price tag">
  <title>Price tag</title>
  <defs>
    <filter id="tag-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="tag-body" d="M19.5,50.4 C23,46 29,40.5 33.6,36.3 C45,35.6 62,36.4 80.2,35.8 C80.6,45 79.7,55 80.3,64.2 C62,63.6 46,64.5 33.4,63.7 C29,59.5 23.5,54.5 19.5,50.4 Z"/>
  </defs>
  <g filter="url(#tag-pencil)">
    <g transform="rotate(-30 50 50)">
      <!-- body: main pass + loose second pass -->
      <use href="#tag-body"/>
      <use href="#tag-body" transform="translate(0.7,-0.6) rotate(0.8 50 50)" stroke-width="1" opacity="0.5"/>
      <!-- hole -->
      <path d="M39.5,50 C39.4,47.8 37.8,46.3 36,46.4 C33.9,46.5 32.5,48.2 32.6,50.1 C32.8,52 34.4,53.6 36.3,53.5 C38.3,53.4 39.6,51.8 39.5,50 Z"/>
      <!-- string loop -->
      <path d="M36,46.4 C34,40 28,34 22,32 C16,30 12,34 14,39 C16,43 24,42 27,38"/>
      <path d="M35.4,46.8 C33.2,41 27.6,35.4 21.6,33.4" stroke-width="1" opacity="0.5"/>
      <!-- price scribbles -->
      <path d="M46,44.6 C52,44.2 60,45 66.4,44.4"/>
      <path d="M46.4,51.2 C51,50.6 56,51.4 60.4,50.8" stroke-width="1.4"/>
      <!-- hatching -->
      <g stroke-width="0.9" opacity="0.8">
        <path d="M44,62.6 l5,-5"/>
        <path d="M50,62.8 l7,-7"/>
        <path d="M56,62.8 l9,-9"/>
        <path d="M62,63 l11,-11"/>
        <path d="M68,63 l11,-11"/>
        <path d="M74,63 l5,-5"/>
      </g>
    </g>
  </g>
</svg>
