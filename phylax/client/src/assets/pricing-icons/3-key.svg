<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Key">
  <title>Key</title>
  <defs>
    <filter id="key-pencil" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="key-bow" d="M45,50 C45.3,42.5 39.6,36.8 32.4,37 C25,37.2 19.2,43 19,50.2 C18.8,57.4 24.6,63.2 31.8,63 C39.2,62.8 44.8,57.2 45,50"/>
    <path id="key-shaft" d="M44.8,47.6 C54,47.2 68,48 80.4,47.4 C82,48.6 82,51.4 80.4,52.6 L80.2,57.8 L74.1,58 L74,52.8 C72.5,52.6 72,52.8 71.5,52.8 L71.6,60.2 L66,60.4 L66,52.8 C60,52.6 52,52.8 44.8,52.4"/>
  </defs>
  <g filter="url(#key-pencil)">
    <g transform="translate(3,-4) rotate(-40 50 50)">
      <!-- bow -->
      <use href="#key-bow"/>
      <use href="#key-bow" transform="translate(0.6,-0.6) rotate(1 32 50)" stroke-width="1" opacity="0.5"/>
      <path d="M20,46 C21,40 27,36.6 33,37.4" stroke-width="1.2"/>
      <!-- bow hole -->
      <path d="M37.5,50 C37.4,47 35,44.4 32,44.5 C29,44.6 26.6,47 26.5,50 C26.5,53 29,55.6 32,55.5 C35,55.4 37.6,53 37.5,50"/>
      <!-- shaft + teeth -->
      <use href="#key-shaft"/>
      <use href="#key-shaft" transform="translate(0.5,0.6)" stroke-width="1" opacity="0.5"/>
      <!-- collar -->
      <path d="M50.6,46.8 C51.4,49 51.4,51 50.6,53.2" stroke-width="1.4"/>
      <!-- hatching -->
      <g stroke-width="0.9" opacity="0.8">
        <path d="M43,53 L38.8,57.6"/>
        <path d="M41.4,56 L36.4,61.4"/>
        <path d="M38,59.4 L33.6,62.2"/>
        <path d="M55.6,52.4 L58.2,47.8"/>
        <path d="M59.4,52.5 L62,47.8"/>
        <path d="M63,52.5 L65.4,48"/>
      </g>
    </g>
  </g>
</svg>
